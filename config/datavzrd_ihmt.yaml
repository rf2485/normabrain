__use_yte__: true

name: ihMT data and stats

datasets:
  desc_stats:
    path: ?input.desc_stats
  vref_stats:
    path: ?input.vref_stats
  b1corr_stats:
    path: ?input.b1corr_stats
  sym_stats:
    path: ?input.sym_stats

default-view: "ihmt_data"

views:
  ihmt_data:
    dataset: desc_stats
    desc: "Overview of the ihMT data with descriptive statistics, for assessment of data quality and normality before running stats."
    render-table:
      columns:
        outliers_removed:
          spell:
            url: v1.6.0/logic/boolean
            with:
              true_value: "True"
              false_value: "False"
        region:
          plot:
            heatmap:
              scale: ordinal
              color-scheme: category20 
        mean:
          plot:
            heatmap:
              scale: linear
              range: ["white", "blue"]
        se:
          display-mode: hidden
        median:
          display-mode: hidden
        q1:
          display-mode: hidden
        q3:
          display-mode: hidden
        iqr:
          display-mode: hidden
        qcd:
          display-mode: hidden
        skew:
          plot:
            heatmap:
              scale: linear
              range: ["red", "white", "blue"]
              domain-mid: 0
        kurt:
          plot:
            heatmap:
              scale: linear
              range: ["red", "white", "blue"]
              domain-mid: 0
        hist:
          custom-plot:
            data: |
              function(value, row) {
                return value
                }
            spec: |
              {
                "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
                "mark": "bar",
                "encoding": {
                  "x": {
                    "field": "bin_start",
                    "bin": "binned",
                    "type": "quantitative",
                    "title": "Value"
                  },
                  "x2": {"field": "bin_end"},
                  "y": {
                    "field": "count",
                    "type": "quantitative",
                    "title": "Frequency"
                  }
                }
              }

  vref_stats:
    dataset: vref_stats
    desc: |
      Within-subject Pearson correlations of Vref100 vs Vref less than 100 images with the same parameters.
      Across 10 white matter regions: left and right frontal, left and right temporal, left and right parietal, left and right occipital, and left and right cerebellar.
      Each row represents a different subject-contrast-b1 correction status-acquisition parameters set.
      Used to assess the ability of the B1 correction to make images with different Vref more similar.
    render-table:
      columns:
        b1corr:
          spell:
            url: v1.6.0/logic/boolean
            with:
              true_value: "True"
              false_value: "False"
        pearson_r:
          plot:
            heatmap:
              scale: linear
              range: ["red", "white", "blue"]
              domain-mid: 0

  b1corr_stats:
    dataset: b1corr_stats
    desc: |
      Within-subject Pearson correlations of B1 corrected versus B1 uncorrected Vref100 images from each set of acquisition parameters.
      Across 10 white matter regions: left and right frontal, left and right temporal, left and right parietal, left and right occipital, and left and right cerebellar.
      Each row representants a different subject-contrast-acquisition parameters set.
      Used to ensure B1 correction does not radically change the contrast of the images.
    render-table:
      columns:
        pearson_r:
          plot:
            heatmap:
              scale: linear
              range: ["red", "white", "blue"]
              domain-mid: 0

  sym_stats:
    dataset: sym_stats
    desc: |
      Within-subject within-image pearson correlations of right versus left regions in Vref100 images from each set of acquisition parameters.
      Each side has 5 regions: frontal, temporal, parietal, occipital, and cerebellar. Thus, these tests are less robust than the B1corr and Vref tests.
      Each row represents a different subject-contrast-b1 correction status-acquisition parameters set.
      Used to assess if B1 correction improves image symmetry.
    render-table:
      columns:
        b1corr:
          spell:
            url: v1.6.0/logic/boolean
            with:
              true_value: "True"
              false_value: "False"
        pearson_r:
          plot:
            heatmap:
              scale: linear
              range: ["red", "white", "blue"]
              domain-mid: 0